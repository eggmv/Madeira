name: Build App

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-app.yml'

jobs:
  build-app:
    name: Build iOS App
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Download dependencies from latest Release
        run: |
          set -e
          echo "⬇️  Downloading dependencies from latest release..."
          
          # Get the latest deps release
          LATEST_RELEASE=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          
          if [ -z "$LATEST_RELEASE" ]; then
            echo "❌ No dependency releases found!"
            echo ""
            echo "To build the app, you must first build the dependencies:"
            echo "  1. Go to Actions → Build Dependencies"
            echo "  2. Click 'Run workflow' → 'Run workflow'"
            echo "  3. Wait ~90 minutes"
            echo "  4. Then run this workflow"
            exit 1
          fi
          
          echo "📦 Found release: $LATEST_RELEASE"
          
          mkdir -p app/Madeira
          
          # Download .a files
          gh release download "$LATEST_RELEASE" \
            --pattern "*.a" \
            --dir app/Madeira 2>/dev/null || true
          
          # Download and extract gnutls
          gh release download "$LATEST_RELEASE" \
            --pattern "gnutls-ios.tar.gz" \
            --dir . 2>/dev/null || true
          
          if [ -f "gnutls-ios.tar.gz" ]; then
            tar -xzf gnutls-ios.tar.gz
            rm gnutls-ios.tar.gz
          fi
          
          # Check if we have the libraries
          if [ ! -f "app/Madeira/libntdll_unix.a" ]; then
            echo "❌ Dependencies not found in release!"
            exit 1
          fi
          
          echo "✅ Dependencies downloaded:"
          ls -lh app/Madeira/*.a 2>/dev/null | awk '{print "   " $9 " (" $5 ")"}'
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Build with xcodebuild
        run: |
          set -e
          cd app/Madeira
          
          echo "🔨 Building iOS app..."
          xcodebuild \
            -scheme Madeira \
            -configuration Release \
            -derivedDataPath ../../build/derived \
            -destination 'generic/platform=iOS' \
            -parallelizeTargets \
            build 2>&1 | tail -50
      
      - name: Show build output
        if: success()
        run: |
          echo "✅ Build succeeded!"
          echo ""
          echo "📦 Build artifacts:"
          find build/derived/Build/Products -type f \( -name "*.app" -o -name "*.ipa" \) 2>/dev/null | while read f; do
            echo "   $(basename "$f") - $(du -h "$f" | cut -f1)"
          done
      
      - name: Upload to GitHub Release
        if: success()
        run: |
          set -e
          echo "📤 Uploading to GitHub Release..."
          
          # Get or create release
          VERSION="app-$(date -u +%Y-%m-%d)_$(git rev-parse --short HEAD)"
          
          # Find IPA
          IPA_FILE=$(find build/derived/Build/Products/Release-iphoneos -name "*.ipa" | head -1)
          
          if [ -z "$IPA_FILE" ]; then
            echo "❌ No IPA file found!"
            exit 1
          fi
          
          echo "📦 Uploading: $(basename "$IPA_FILE")"
          
          # Create or update release
          gh release create "$VERSION" \
            "$IPA_FILE" \
            --title "Madeira Build - $(date -u +%Y-%m-%d)" \
            --notes "Built from commit: ${{ github.sha }}" \
            --target main 2>/dev/null || \
          gh release upload "$VERSION" "$IPA_FILE" --clobber
          
          echo "✅ Uploaded to release: $VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Upload build artifacts (Actions backup)
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: Madeira-${{ github.sha }}
          path: build/derived/Build/Products/Release-iphoneos/
          retention-days: 14
      
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: build-logs-${{ github.sha }}
          path: build/derived/Logs/
          retention-days: 3
