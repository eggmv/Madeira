name: Build Dependencies

on:
  workflow_dispatch:  # Manual trigger only

concurrency:
  group: build-deps
  cancel-in-progress: false

jobs:
  build-libs:
    name: Build all .a libraries
    runs-on: macos-latest
    timeout-minutes: 120
    
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Generate version tag
        id: version
        run: |
          VERSION="$(date -u +%Y-%m-%d)_$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Build freetype (iOS)
        run: |
          set -e
          echo "🔨 Building freetype..."
          
          # Clone freetype if not present
          if [ ! -d "research/freetype/.git" ]; then
            git clone --depth 1 --branch VER-2-13-3 \
              https://github.com/freetype/freetype.git research/freetype
          fi
          
          cd build/freetype-ios
          bash ./build.sh 2>&1 | tail -20
      
      - name: Build GnuTLS stack
        run: |
          set -e
          echo "🔨 Building GnuTLS (gmp, nettle, gnutls)..."
          cd build/gnutls-ios
          bash ./build.sh 2>&1 | tail -20
      
      - name: Build Wine ntdll unix
        run: |
          set -e
          echo "🔨 Building Wine ntdll unix..."
          cd build/ntdll-unix
          bash ./build.sh 2>&1 | tail -20
      
      - name: Build Wine win32u unix
        run: |
          set -e
          echo "🔨 Building Wine win32u unix..."
          cd build/win32u-unix
          bash ./build.sh 2>&1 | tail -20
      
      - name: Build DXMT
        run: |
          set -e
          echo "🔨 Building DXMT..."
          cd build/dxmt-ios
          bash ./build.sh 2>&1 | tail -20
      
      - name: Verify artifacts
        run: |
          echo "📦 Built artifacts:"
          ls -lh app/Madeira/*.a 2>/dev/null || echo "(no .a files yet)"
          du -sh app/Madeira/ 2>/dev/null || true
      
      - name: Package libraries
        if: success()
        run: |
          set -e
          echo "📦 Packaging libraries..."
          
          mkdir -p release
          
          # Copy all .a files
          cp app/Madeira/*.a release/ 2>/dev/null || true
          
          # Copy gnutls toolchain
          tar -czf release/gnutls-ios.tar.gz toolchains/gnutls-ios/ 2>/dev/null || true
          
          # Create checksums
          cd release
          sha256sum * > SHA256SUMS
          cd ..
          
          echo "✅ Release contents:"
          ls -lh release/
      
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: deps-${{ steps.version.outputs.version }}
          name: "Dependencies - ${{ steps.version.outputs.version }}"
          body: |
            ## Madeira Build Dependencies
            
            Built from commit: ${{ github.sha }}
            
            Contains:
            - `libntdll_unix.a` - Wine ntdll unix side
            - `libwin32u_unix.a` - Wine win32u unix side
            - `libdxmt_unix.a` - DXMT unix side
            - `libdxmt_combined.a` - DXMT combined with LLVM
            - `gnutls-ios.tar.gz` - GnuTLS toolchain (extract to `toolchains/`)
            - `SHA256SUMS` - Checksums for verification
            
            To use: Extract the `.a` files to `app/Madeira/` and the `.tar.gz` to `toolchains/`
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.version.outputs.version }}
          path: build/**/obj/*.err
          retention-days: 7
