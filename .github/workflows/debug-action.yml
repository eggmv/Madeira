name: Build Madeira (Debug & Fix)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-madeira:
    name: Build Native Pieces & iOS App
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Build Dependencies
        run: |
          echo "Installing build prerequisites via Homebrew..."
          brew install cmake ninja pkg-config bison flex

      - name: Sync and Force Update Submodules
        run: |
          set -e
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Create Required Base Directories
        run: |
          mkdir -p toolchains
          mkdir -p app/Madeira
          mkdir -p build/derived
          mkdir -p build/ntdll-unix/obj
          mkdir -p build/win32u-unix/obj
          mkdir -p build/dxmt-ios/obj

      - name: Fetch and Setup llvm-mingw Toolchain
        run: |
          set -e
          echo "🔍 Setting up llvm-mingw toolchain..."
          
          TOOLCHAIN_DIR="toolchains/llvm-mingw-20260421-ucrt-macos-universal"
          
          if [ ! -d "$TOOLCHAIN_DIR" ]; then
            echo "📦 Toolchain not found locally. Downloading llvm-mingw release..."
            
            # Download llvm-mingw toolchain tarball
            curl -L -o toolchains/llvm-mingw.tar.xz \
              https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz
            
            echo "📦 Extracting toolchain..."
            tar -xf toolchains/llvm-mingw.tar.xz -C toolchains/
            rm toolchains/llvm-mingw.tar.xz
          fi

          echo "✅ Toolchain path verification:"
          ls -la "$TOOLCHAIN_DIR/bin/x86_64-w64-mingw32-clang"

      - name: Build Native Modules (Specific Dependency Order)
        run: |
          set -e
          
          # List build subdirectories in their proper dependency order
          BUILD_DIRS=(
            "build/freetype-ios"
            "build/gnutls-ios"
            "build/ntdll-unix"
            "build/win32u-unix"
            "build/dxmt-ios"
            "build/d3d11-triangle"
          )

          for dir in "${BUILD_DIRS[@]}"; do
            if [ -f "$dir/build.sh" ]; then
              echo "=========================================="
              echo "Building: $dir"
              echo "=========================================="
              (cd "$dir" && bash ./build.sh)
            fi
          done

      - name: Build iOS App with Xcode
        run: |
          set -o pipefail
          PROJ_PATH=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)

          if [ -z "$PROJ_PATH" ]; then
            echo "❌ Error: Could not locate .xcodeproj file!"
            exit 1
          fi

          xcodebuild \
            -project "$PROJ_PATH" \
            -scheme Madeira \
            -configuration Release \
            -derivedDataPath build/derived \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package IPA
        if: success()
        run: |
          set -e
          APP_PATH=$(find build/derived/Build/Products -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app bundle not found!"
            exit 1
          fi

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../Madeira.ipa Payload
          cd ../..
          echo "✅ Generated build/Madeira.ipa"

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: build/Madeira.ipa
